openapi: 3.0.3
info:
  title: OpenYoumiya Open API
  version: 0.1.0
servers:
  - url: https://openapi.youmiya.love
security:
  - bearerAuth: []
paths:
  /v1/healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                $ref: "../models/health.schema.json"
  /v1/events:
    get:
      summary: Events placeholder
      responses:
        "200":
          description: Public event list when published
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
